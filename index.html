        questionCounter.textContent = "Pertanyaan " + (currentQuestion + 1) + " dari " + total;
        scoreMini.textContent = "Skor: " + score;
        progressFill.style.width = ((currentQuestion / total) * 100) + "%";
      }

      function renderQuestion() {
        const item = activeQuestions[currentQuestion];
        const colors = tagStyle(item.sila);
        answered = false;
        feedback.textContent = "";
        nextButton.classList.add("hidden-ui");
        silaTag.textContent = item.sila;
        silaTag.style.background = colors.background;
        silaTag.style.color = colors.color;
        questionEmoji.textContent = item.emoji;
        questionText.textContent = item.q;
        answerList.replaceChildren();

        item.a.forEach(function (answer, index) {
          const button = document.createElement("button");
          const letter = document.createElement("span");
          const text = document.createElement("span");
          const shades = ["#eaf3ff", "#fff4dc", "#f1eaff"];

          button.type = "button";
          button.className = "answer-option";
          button.style.background = shades[index];
          button.dataset.index = String(index);
          button.setAttribute("aria-label", "Pilihan " + String.fromCharCode(65 + index) + ": " + answer);

          letter.className = "answer-letter";
          letter.textContent = String.fromCharCode(65 + index);
          text.className = "font-bold text-xl";
          text.textContent = answer;

          button.append(letter, text);
          button.addEventListener("click", function () {
            chooseAnswer(button, index);
          });
          answerList.appendChild(button);
        });

        updateProgress();
      }

      function chooseAnswer(button, index) {
        if (answered || button.disabled) return;

        const item = activeQuestions[currentQuestion];
        if (index !== item.correct) {
          button.classList.add("wrong");
          button.disabled = true;
          feedback.textContent = "Belum tepat. Coba pilihan yang lain, ya!";
          return;
        }

        answered = true;
        score += 1;
        answerList.querySelectorAll(".answer-option").forEach(function (option, optionIndex) {
          option.disabled = true;
          if (optionIndex === item.correct) option.classList.add("correct");
        });

        feedback.textContent = "Hebat! Jawaban kalian benar! ✨";
        scoreMini.textContent = "Skor: " + score;
        nextButton.classList.remove("hidden-ui");
        nextButton.focus();
      }

      function showResult() {
        quizScreen.classList.add("hidden-ui");
        resultScreen.classList.remove("hidden-ui");
        progressFill.style.width = "100%";
        scoreResult.textContent = "Skor Kelas: " + score + " / " + activeQuestions.length;
        resultDetail.textContent = score === activeQuestions.length
          ? "Luar biasa! Semua jawaban benar."
          : "Terima kasih sudah belajar Pancasila bersama.";
        restartButton.focus();
      }

      setupForm.addEventListener("submit", function (event) {
        event.preventDefault();
        const selectedCount = Number(countSelect.value);
        activeQuestions = questionBank.slice(0, selectedCount);
        currentQuestion = 0;
        score = 0;
        setupScreen.classList.add("hidden-ui");
        resultScreen.classList.add("hidden-ui");
        quizScreen.classList.remove("hidden-ui");
        renderQuestion();
      });

      nextButton.addEventListener("click", function () {
        if (currentQuestion < activeQuestions.length - 1) {
          currentQuestion += 1;
          renderQuestion();
        } else {
          showResult();
        }
      });

      restartButton.addEventListener("click", function () {
        resultScreen.classList.add("hidden-ui");
        quizScreen.classList.add("hidden-ui");
        setupScreen.classList.remove("hidden-ui");
        countSelect.focus();
      });
    });
  </script>
 </body>
</html>
