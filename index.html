    :root {
      --ink: #26334d;
      --red: #e74747;
      --cream: #fff9e8;
      --blue: #4b82c3;
      --yellow: #ffc83d;
      --mint: #dff3e8;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      font-family: "Alegreya Sans", sans-serif;
      color: var(--ink);
    }

    .page-shell {
      width: 100%;
      min-height: calc(100 * min(var(--vh, 1vh), 1vh));
      position: relative;
      overflow: hidden;
      padding: 24px;
    }

    .page-shell::before,
    .page-shell::after {
      content: "";
      position: absolute;
      pointer-events: none;
      border-radius: 999px;
      opacity: .55;
    }

    .page-shell::before {
      width: 280px;
      height: 280px;
      background: #ffd766;
      top: -110px;
      right: -70px;
    }

    .page-shell::after {
      width: 220px;
      height: 220px;
      background: #c9e9ff;
      bottom: -120px;
      left: -70px;
    }

    .game-frame {
      width: 100%;
      max-width: 1040px;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .paper-shadow {
      box-shadow: 0 12px 0 rgba(38, 51, 77, .12), 0 22px 35px rgba(38, 51, 77, .13);
    }

    .title-font { font-family: "Eczar", serif; }

    .progress-dot {
      width: 13px;
      height: 13px;
      border-radius: 999px;
      background: #d9e0e9;
      transition: background .25s ease, transform .25s ease;
    }

    .progress-dot.active {
      background: var(--red);
      transform: scale(1.28);
    }

    .progress-dot.done { background: var(--yellow); }

    .question-card {
      display: none;
      animation: enter .38s ease both;
    }

    .question-card.active { display: block; }

    .answer-option {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 14px;
      text-align: left;
      border: 3px solid transparent;
      border-radius: 18px;
      padding: 15px 18px;
      cursor: pointer;
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      box-shadow: 0 4px 0 rgba(38, 51, 77, .13);
    }

    .answer-option:hover {
      transform: translateY(-3px);
      border-color: #4b82c3;
    }

    .answer-option:focus-visible,
    .next-button:focus-visible,
    .restart-button:focus-visible {
      outline: 4px solid #26334d;
      outline-offset: 3px;
    }

    .answer-option:disabled {
      cursor: default;
      opacity: .82;
      transform: none;
    }

    .answer-option.correct {
      border-color: #26975d;
      background: #dff3e8 !important;
    }

    .answer-option.wrong {
      border-color: #e74747;
      background: #ffe1df !important;
    }

    .answer-letter {
      flex: 0 0 34px;
      height: 34px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      font-weight: 800;
      color: #fff;
      background: #4b82c3;
    }

    .feedback {
      min-height: 31px;
      font-size: 1.25rem;
      font-weight: 700;
    }

    .hidden-ui { display: none !important; }

    .next-button, .restart-button {
      transition: transform .18s ease, box-shadow .18s ease;
      box-shadow: 0 5px 0 rgba(38, 51, 77, .18);
    }

    .next-button:hover, .restart-button:hover {
      transform: translateY(-2px);
      box-shadow: 0 7px 0 rgba(38, 51, 77, .16);
    }

    @keyframes enter {
      from { opacity: 0; transform: translateY(13px) rotate(-.4deg); }
      to { opacity: 1; transform: translateY(0) rotate(0); }
    }

    @media (max-width: 640px) {
      .page-shell { padding: 14px; }
      .answer-option { padding: 13px; gap: 10px; }
    }
  </style>

      const feedback = document.getElementById("feedback-message");
      const nextButton = document.getElementById("next-button");
      const resultScreen = document.getElementById("result-screen");
      const quizArea = document.getElementById("quiz-area");
      const feedbackPanel = document.getElementById("feedback-panel");
      const scoreResult = document.getElementById("score-result");
      const restartButton = document.querySelector('[data-template-id="restart-button"]');

      let currentQuestion = 0;
      let score = 0;
      let answered = false;
      let totalQuestions = Number(questionCount.value);

      function updateProgress() {
        counter.textContent = "Pertanyaan " + (currentQuestion + 1) + " dari " + totalQuestions;
        dots.forEach(function (dot, index) {
          dot.classList.toggle("hidden-ui", index >= totalQuestions);
          dot.classList.toggle("active", index === currentQuestion);
          dot.classList.toggle("done", index < currentQuestion);
        });
      }

      function applyQuestionCount() {
        totalQuestions = Number(questionCount.value);
        cards.forEach(function (card, index) {
          card.classList.toggle("hidden-ui", index >= totalQuestions);
        });
        score = 0;
        currentQuestion = 0;
        resultScreen.classList.add("hidden-ui");
        feedbackPanel.classList.remove("hidden-ui");
        document.querySelectorAll(".answer-option").forEach(function (option) {
          option.disabled = false;
          option.classList.remove("correct", "wrong");
        });
        showQuestion(0);
      }

      function showQuestion(index) {
        cards.forEach(function (card, cardIndex) {
          card.classList.toggle("active", cardIndex === index);
        });
        answered = false;
        feedback.textContent = "";
        nextButton.classList.add("hidden-ui");
        updateProgress();
      }

      function selectAnswer(button) {
        if (answered) return;

        const isCorrect = button.dataset.correct === "true";
        const activeCard = cards[currentQuestion];

        if (!isCorrect) {
          button.classList.add("wrong");
          button.disabled = true;
          feedback.textContent = "Belum tepat. Yuk, diskusikan lagi bersama teman-teman!";
          return;
        }

        answered = true;
        score += 1;
        button.classList.add("correct");
        activeCard.querySelectorAll(".answer-option").forEach(function (option) {
          option.disabled = true;
          if (option.dataset.correct === "true") option.classList.add("correct");
        });

        feedback.textContent = "Hebat! Jawaban kelas kalian benar! ✨";
        nextButton.classList.remove("hidden-ui");
        nextButton.focus();
      }

      document.querySelectorAll(".answer-option").forEach(function (button) {
        button.addEventListener("click", function () {
          selectAnswer(button);
        });
      });

      nextButton.addEventListener("click", function () {
        if (currentQuestion < totalQuestions - 1) {
          currentQuestion += 1;
          showQuestion(currentQuestion);
        } else {
          cards.forEach(function (card) { card.classList.remove("active"); });
          feedbackPanel.classList.add("hidden-ui");
          resultScreen.classList.remove("hidden-ui");
          scoreResult.textContent = "Skor Kelas: " + score + " / " + cards.length;
          dots.forEach(function (dot) {
            dot.classList.remove("active");
            dot.classList.add("done");
          });
        }
      });

      questionCount.addEventListener("change", applyQuestionCount);

      restartButton.addEventListener("click", function () {
        score = 0;
        currentQuestion = 0;
        resultScreen.classList.add("hidden-ui");
        feedbackPanel.classList.remove("hidden-ui");

        document.querySelectorAll(".answer-option").forEach(function (option) {
          option.disabled = false;
          option.classList.remove("correct", "wrong");
        });

        showQuestion(currentQuestion);
      });

      updateProgress();
    });
  </script>
 </body>
</html>
